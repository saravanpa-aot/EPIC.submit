name: Release Please

on:
  push:
    branches:
      - develop  # or 'master', or whichever is your default branch

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Run Release Please
        uses: google-github-actions/release-please-action@v4
        with:
          release-type: simple
